[project]
name = "lighting"
version = "0.4.0"
description = "Windows HappyLighting BLE controller prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bleak>=3.0.1",
  "PySide6>=6.9.0",
]

[project.scripts]
lighting = "happylighting.app:main"
lighting-build = "happylighting.build:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
